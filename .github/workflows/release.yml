name: Release NetTamer

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0 或 1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: '版本说明 / 更新日志 (支持 Markdown，换行可使用 \n)'
        required: false
        default: |
          ### ✨ 本次更新内容
          - 📌 **桌面置顶网速悬浮窗**：支持原生拖拽、透明度调节、鼠标穿透模式与主题自适应。
          - 💻 **任务栏实时网速**：全透明嵌入系统任务栏，单行精准垂直居中。
          - 🚗 **流量高速公路**：3D 悬浮多车道车流映射与全局实时网速监控。
          - 🎯 **进程级精准双向限速**：基于 WinDivert 与令牌桶算法的高性能流量控制。
          - ⚡ **ETW 零损耗内核监控**：实时精准捕获各进程网络流速与超额告警。
      is_draft:
        description: '是否保存为草稿 (Draft)'
        type: boolean
        required: false
        default: false
      is_prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> app/src-tauri/target'

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Normalize Version & Tag Name
        id: vars
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}".Trim()
          if ($inputVer -notmatch '^v') {
            $tag = "v$inputVer"
            $rawVer = $inputVer
          } else {
            $tag = $inputVer
            $rawVer = $inputVer.Substring(1)
          }
          Write-Host "Tag Name: $tag"
          Write-Host "Raw Version: $rawVer"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "raw_version=$rawVer" >> $env:GITHUB_OUTPUT

      - name: Build Tauri App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './app'
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'NetTamer ${{ steps.vars.outputs.tag }} - 网络驯兽师'
          releaseBody: |
            # 🐾 NetTamer (网络驯兽师) ${{ steps.vars.outputs.tag }}

            > **Tame your runaway network traffic.**
            > 一款专为解决“后台程序偷偷满速上传、吃满带宽、导致游戏跳 ping 和网页卡顿”而生的现代轻量级桌面端网络监控与流量整形工具。

            ---

            ${{ github.event.inputs.release_notes }}

            ---

            ### 📦 安装包说明

            | 文件格式 | 说明 |
            | :--- | :--- |
            | `NetTamer_*_x64-setup.exe` | **NSIS 安装引导包 (推荐)**，支持桌面快捷方式与开机自启 |
            | `NetTamer_*_x64_en-US.msi` | **Windows Installer 微软标准安装包** |

            ---

            > ⚠️ **运行提示**：由于 ETW 实时内核网络跟踪与 WinDivert 驱动需控制系统网络协议栈，程序需**以管理员身份运行**。
          releaseDraft: ${{ github.event.inputs.is_draft == 'true' }}
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
