[package]
name = "nettamer"
version = "1.0.0"
description = "NetTamer - Windows network monitor & traffic shaper (Rust/Tauri 2.0 backend)"
authors = ["NetTamer"]
edition = "2021"
rust-version = "1.77"

[lib]
# The Tauri library crate. The binary entry point lives in `src/main.rs`
# and simply calls `nettamer_lib::run()`.
name = "nettamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

windows-sys = { version = "0.52", features = [
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_UI_WindowsAndMessaging",
] }

rusqlite = { version = "0.30", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.23"

thiserror = "1"
log = "0.4"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
# Custom Tauri 2 build profile (smaller binaries). The default is fine for dev.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
