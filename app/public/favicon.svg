<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Paw Print 🐾 -->
  <g fill="url(#pawGrad)">
    <!-- 4 Toe Pads -->
    <ellipse cx="40" cy="42" rx="9" ry="12" transform="rotate(-20 40 42)"/>
    <ellipse cx="56" cy="34" rx="9" ry="13" transform="rotate(-6 56 34)"/>
    <ellipse cx="72" cy="34" rx="9" ry="13" transform="rotate(6 72 34)"/>
    <ellipse cx="88" cy="42" rx="9" ry="12" transform="rotate(20 88 42)"/>

    <!-- Main Metacarpal Pad -->
    <path d="M42 74 C42 63, 52 58, 64 64 C76 58, 86 63, 86 74 C86 86, 75 96, 64 96 C53 96, 42 86, 42 74 Z"/>
  </g>
</svg>
